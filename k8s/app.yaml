apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devops
data:
  APP_PORT: "8080"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: devops
spec:
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: app
          image: devops-notes:level2
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: redis-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: devops
spec:
  type: NodePort
  selector:
    app: notes
  ports:
    - port: 8080
      nodePort: 30080
